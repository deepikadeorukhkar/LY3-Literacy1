```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Family 'o'</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Baloo 2', cursive;
}

body{
overflow:hidden;
background:#fff7f0;
}

#intro{
position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
flex-direction:column;
}

#intro img{
width:220px;
max-width:80%;
}

#intro h1{
margin-top:20px;
color:#ff5a8a;
font-size:2rem;
}

#gameContainer{
display:none;
width:100vw;
height:100vh;
overflow:hidden;
position:relative;
background:linear-gradient(#dff7ff,#fff8ef);
}

#topBar{
background:#ffb6d9;
padding:12px;
text-align:center;
font-size:1.4rem;
font-weight:bold;
color:#5b2d2d;
box-shadow:0 3px 5px rgba(0,0,0,0.2);
}

#instruction{
background:white;
padding:10px;
text-align:center;
font-size:1.1rem;
color:#444;
}

#content{
height:calc(100vh - 110px);
overflow:auto;
padding:15px;
text-align:center;
}

h2{
color:#ff4f81;
margin-bottom:10px;
}

.imageBox img{
width:180px;
max-width:60vw;
border-radius:20px;
background:white;
padding:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.options{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
margin-top:20px;
}

.balloon{
width:100px;
height:130px;
background:#ff6ea8;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:1.5rem;
font-weight:bold;
color:white;
position:relative;
cursor:pointer;
transition:0.3s;
animation:float 3s infinite ease-in-out;
}

.balloon:nth-child(2){background:#ffb347;}
.balloon:nth-child(3){background:#7ed957;}
.balloon:nth-child(4){background:#6ec6ff;}

.balloon::after{
content:'';
position:absolute;
bottom:-35px;
width:2px;
height:35px;
background:#555;
}

.balloon:hover{
transform:scale(1.08);
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-12px);}
}

.wordBtn{
padding:15px 25px;
font-size:1.5rem;
background:#fff176;
border:none;
border-radius:15px;
cursor:pointer;
box-shadow:0 4px 8px rgba(0,0,0,0.2);
transition:0.3s;
}

.wordBtn:hover{
transform:scale(1.05);
}

.garden{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
margin-top:20px;
}

.house{
width:120px;
min-height:160px;
background:#ffe0b2;
border-radius:20px;
padding:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.house img{
width:80px;
height:80px;
object-fit:contain;
}

.dropzone{
margin-top:10px;
height:45px;
border:2px dashed #ff6ea8;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
font-size:1.3rem;
background:white;
}

.dragWords{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
margin-top:25px;
}

.drag{
padding:12px 18px;
background:#81d4fa;
border-radius:12px;
font-size:1.3rem;
cursor:grab;
}

.letters{
display:flex;
justify-content:center;
gap:15px;
margin-top:25px;
flex-wrap:wrap;
}

.letterBtn{
width:70px;
height:70px;
border-radius:50%;
border:none;
background:#ffd54f;
font-size:2rem;
font-weight:bold;
cursor:pointer;
}

.feedback{
font-size:4rem;
margin-top:15px;
height:60px;
}

#restartBtn{
display:none;
margin:20px auto;
padding:15px 30px;
font-size:1.4rem;
background:#ff5a8a;
color:white;
border:none;
border-radius:20px;
cursor:pointer;
}

@media(max-width:768px){

#topBar{
font-size:1.1rem;
}

.wordBtn{
font-size:1.2rem;
padding:12px 18px;
}

.balloon{
width:85px;
height:110px;
font-size:1.2rem;
}

.house{
width:42%;
}

.letterBtn{
width:60px;
height:60px;
font-size:1.7rem;
}

}

</style>
</head>

<body>

<div id="intro">
<img src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/innovine-logo.png">
<h1>Word Family 'o'</h1>
</div>

<div id="gameContainer">

<div id="topBar">Word Family 'o'</div>

<div id="instruction">Loading...</div>

<div id="content"></div>

<div class="feedback" id="feedback"></div>

<button id="restartBtn" onclick="restartGame()">🔄 Restart Game</button>

</div>

<audio id="correctSound" src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/correct.mp3"></audio>

<audio id="wrongSound" src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/wrong.mp3"></audio>

<audio id="bgMusic" loop autoplay
src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/background-music.mp3"></audio>

<script>

const content=document.getElementById("content");
const instruction=document.getElementById("instruction");
const feedback=document.getElementById("feedback");

const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");

function speak(text){
speechSynthesis.cancel();
const msg=new SpeechSynthesisUtterance(text);
msg.rate=0.85;
speechSynthesis.speak(msg);
}

function showCorrect(){
feedback.innerHTML="👏";
correctSound.play();
setTimeout(()=>feedback.innerHTML="",1200);
}

function showWrong(){
feedback.innerHTML="❌";
wrongSound.play();
setTimeout(()=>feedback.innerHTML="",1200);
}

/* INTRO */

setTimeout(()=>{
document.getElementById("intro").style.display="none";
document.getElementById("gameContainer").style.display="block";
startGame1();
},5000);

/* GAME 1 */

const game1Words=["hop","top","mop","cop"];
let game1Index=0;

function startGame1(){

instruction.innerHTML="Game 1: Look at the picture and pop the balloon with the correct word.";

const word=game1Words[game1Index];

content.innerHTML=`
<h2>Game 1</h2>

<div class="imageBox">
<img src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/${word}.png">
</div>

<div class="options">
${shuffle([...game1Words]).map(w=>
`<div class="balloon" onclick="checkGame1('${w}')">${w}</div>`
).join("")}
</div>
`;

speak(word);

}

function checkGame1(word){

if(word===game1Words[game1Index]){

showCorrect();

game1Index++;

if(game1Index<game1Words.length){

setTimeout(startGame1,1200);

}else{

setTimeout(startGame2,1500);

}

}else{

showWrong();
speak("Try again");

}

}

/* GAME 2 */

const game2Words=["cob","rob","sob","mob"];
let game2Index=0;

function startGame2(){

instruction.innerHTML="Game 2: Look at the picture and choose the correct word.";

const word=game2Words[game2Index];

content.innerHTML=`
<h2>Game 2</h2>

<div style="background:#fff3cd;padding:20px;border-radius:25px;max-width:700px;margin:auto;">
<div class="imageBox">
<img src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/${word}.png">
</div>

<div style="margin-top:25px;display:grid;grid-template-columns:repeat(2,1fr);gap:15px;">
${shuffle([...game2Words]).map(w=>
`<button class="wordBtn" onclick="checkGame2('${w}')">${w}</button>`
).join("")}
</div>
</div>
`;

speak(word);

}

function checkGame2(word){

if(word===game2Words[game2Index]){

showCorrect();

game2Index++;

if(game2Index<game2Words.length){

setTimeout(startGame2,1200);

}else{

setTimeout(startGame3,1500);

}

}else{

showWrong();

}

}

/* GAME 3 */

const game3Words=["hot","pot","dot","cot","tot"];

function startGame3(){

instruction.innerHTML="Game 3: Look at the picture and drag the correct word to match it.";

content.innerHTML=`
<h2>Game 3</h2>

<div class="garden">
${game3Words.map(word=>`
<div class="house">
<img src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/${word}.png">
<div class="dropzone" data-word="${word}"></div>
</div>
`).join("")}
</div>

<div class="dragWords">
${shuffle([...game3Words]).map(word=>`
<div class="drag" draggable="true" data-word="${word}">
${word}
</div>
`).join("")}
</div>
`;

enableDragDrop();

}

function enableDragDrop(){

const drags=document.querySelectorAll(".drag");
const drops=document.querySelectorAll(".dropzone");

drags.forEach(drag=>{

drag.addEventListener("dragstart",e=>{
e.dataTransfer.setData("word",drag.dataset.word);
});

});

drops.forEach(drop=>{

drop.addEventListener("dragover",e=>e.preventDefault());

drop.addEventListener("drop",e=>{

e.preventDefault();

const word=e.dataTransfer.getData("word");

if(word===drop.dataset.word){

drop.innerHTML=word;

document.querySelector(`.drag[data-word='${word}']`).style.display="none";

showCorrect();

if(document.querySelectorAll(".dropzone:not(:empty)").length===5){

setTimeout(startGame4,1500);

}

}else{

showWrong();

}

});

});

}

/* GAME 4 */

const game4Data=[
{img:"fog",correct:"f",options:["d","l","f"]},
{img:"dog",correct:"d",options:["m","j","d"]},
{img:"log",correct:"l",options:["l","f","j"]},
{img:"jog",correct:"j",options:["s","j","t"]}
];

let game4Index=0;

function startGame4(){

instruction.innerHTML="Game 4: Look at the picture and choose the correct letter.";

const item=game4Data[game4Index];

content.innerHTML=`
<h2>Game 4</h2>

<div class="imageBox">
<img src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/${item.img}.png">
</div>

<h1 style="font-size:4rem;margin-top:15px;">_og</h1>

<div class="letters">
${shuffle([...item.options]).map(letter=>
`<button class="letterBtn" onclick="checkGame4('${letter}')">${letter}</button>`
).join("")}
</div>
`;

speak(item.img);

}

function checkGame4(letter){

const item=game4Data[game4Index];

if(letter===item.correct){

showCorrect();

game4Index++;

if(game4Index<game4Data.length){

setTimeout(startGame4,1200);

}else{

finishGame();

}

}else{

showWrong();

}

}

function finishGame(){

instruction.innerHTML="Wonderful Work!";

content.innerHTML=`
<div style="margin-top:60px;">
<h1 style="font-size:4rem;color:#ff4081;">👏 GREAT JOB 👏</h1>
</div>
`;

speak("Great Job");

document.getElementById("restartBtn").style.display="block";

}

function restartGame(){

location.reload();

}

function shuffle(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];

}

return array;

}

</script>

</body>
</html>
