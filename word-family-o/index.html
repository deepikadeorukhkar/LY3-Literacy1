<body>

<div id="intro">
<img src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/innovine-logo.png">
<h1>Word Family 'o'</h1>
</div>

<div id="gameContainer">
<div id="topBar">Word Family 'o'</div>
<div id="instruction">Loading...</div>
<div id="content"></div>
<div class="feedback" id="feedback"></div>
<button id="restartBtn" onclick="location.reload()">🔄 Restart Game</button>
</div>

<audio id="correctSound" src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/correct.mp3"></audio>
<audio id="wrongSound" src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/wrong.mp3"></audio>
<audio id="bgMusic" autoplay loop src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/background-music.mp3"></audio>

<script>

const content=document.getElementById('content');
const instruction=document.getElementById('instruction');
const feedback=document.getElementById('feedback');

function speak(text){
speechSynthesis.cancel();
const msg=new SpeechSynthesisUtterance(text);
msg.rate=0.85;
speechSynthesis.speak(msg);
}

function showCorrect(){
feedback.innerHTML='👏';
document.getElementById('correctSound').play();
setTimeout(()=>feedback.innerHTML='',1000);
}

function showWrong(){
feedback.innerHTML='❌';
document.getElementById('wrongSound').play();
setTimeout(()=>feedback.innerHTML='',1000);
}

setTimeout(()=>{
document.getElementById('intro').style.display='none';
document.getElementById('gameContainer').style.display='block';
startGame1();
},5000);

/* GAME 1 */

const game1Words=['hop','top','mop','cop'];
let game1Index=0;

function startGame1(){
instruction.innerHTML='Game 1: Look at the picture and pop the balloon with the correct word.';
const word=game1Words[game1Index];

content.innerHTML=`
<h2>Game 1</h2>
<div class="imageBox">
<img src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/${word}.png">
</div>
<div class="options">
${shuffle([...game1Words]).map(w=>`<div class="balloon" onclick="checkGame1('${w}')">${w}</div>`).join('')}
</div>`;

speak(word);
}

function checkGame1(word){
if(word===game1Words[game1Index]){
showCorrect();
game1Index++;
if(game1Index<game1Words.length){
setTimeout(startGame1,1200);
}else{
setTimeout(startGame2,1200);
}
}else{
showWrong();
}
}

/* GAME 2 */

const game2Words=['cob','rob','sob','mob'];
let game2Index=0;

function startGame2(){
instruction.innerHTML='Game 2: Look at the picture and choose the correct word.';
const word=game2Words[game2Index];

content.innerHTML=`
<h2>Game 2</h2>
<div style="background:#fff3cd;padding:20px;border-radius:25px;max-width:700px;margin:auto;">
<div class="imageBox">
<img src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/${word}.png">
</div>
<div style="margin-top:25px;display:grid;grid-template-columns:repeat(2,1fr);gap:15px;">
${shuffle([...game2Words]).map(w=>`<button class="wordBtn" onclick="checkGame2('${w}')">${w}</button>`).join('')}
</div>
</div>`;

speak(word);
}

function checkGame2(word){
if(word===game2Words[game2Index]){
showCorrect();
game2Index++;
if(game2Index<game2Words.length){
setTimeout(startGame2,1200);
}else{
setTimeout(startGame3,1200);
}
}else{
showWrong();
}
}

/* GAME 3 FIXED FOR IOS + ANDROID */

const game3Words=['hot','pot','dot','cot','tot'];
let placedWords=0;

function startGame3(){

placedWords=0;

instruction.innerHTML='Game 3: Look at the picture and drag the correct word to match it.';

content.innerHTML=`
<h2>Game 3</h2>

<div class="garden">
${shuffle([...game3Words]).map(word=>`
<div class="houseCard">
<img src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/${word}.png">
<div class="dropzone" data-word="${word}"></div>
</div>
`).join('')}
</div>

<div class="dragArea">
${shuffle([...game3Words]).map(word=>`
<div class="dragWord" draggable="true" data-word="${word}">${word}</div>
`).join('')}
</div>`;

setupDragDrop();
}

function setupDragDrop(){

const drags=document.querySelectorAll('.dragWord');
const drops=document.querySelectorAll('.dropzone');

let activeDrag=null;

/* DESKTOP */
drags.forEach(drag=>{

drag.addEventListener('dragstart',e=>{
activeDrag=drag;
e.dataTransfer.setData('text/plain',drag.dataset.word);
});

});

/* DESKTOP DROP */
drops.forEach(drop=>{

drop.addEventListener('dragover',e=>{
e.preventDefault();
});


drop.addEventListener('drop',e=>{
e.preventDefault();
const word=activeDrag.dataset.word;
checkDrop(word,drop,activeDrag);
});

});

/* MOBILE TOUCH */
drags.forEach(drag=>{

let clone=null;

const moveAt=(x,y)=>{
if(clone){
clone.style.left=(x-50)+'px';
clone.style.top=(y-25)+'px';
}
}

const touchStart=e=>{
activeDrag=drag;
clone=drag.cloneNode(true);
clone.style.position='fixed';
clone.style.zIndex='9999';
clone.style.pointerEvents='none';
clone.style.opacity='0.9';
document.body.appendChild(clone);
moveAt(e.touches[0].clientX,e.touches[0].clientY);
};

const touchMove=e=>{
e.preventDefault();
moveAt(e.touches[0].clientX,e.touches[0].clientY);
};

const touchEnd=e=>{
if(clone) clone.remove();

const touch=e.changedTouches[0];

let dropped=false;


drops.forEach(drop=>{
const rect=drop.getBoundingClientRect();

if(
touch.clientX>rect.left &&
touch.clientX<rect.right &&
touch.clientY>rect.top &&
touch.clientY<rect.bottom
){
checkDrop(drag.dataset.word,drop,drag);
dropped=true;
}
});

clone=null;
};


drag.addEventListener('touchstart',touchStart,{passive:false});
drag.addEventListener('touchmove',touchMove,{passive:false});
drag.addEventListener('touchend',touchEnd);

});
}

function checkDrop(word,drop,drag){

if(drop.dataset.word===word && drop.innerHTML===''){

drop.innerHTML=word;
drag.classList.add('used');
showCorrect();
placedWords++;

if(placedWords===5){
setTimeout(startGame4,1400);
}

}else{
showWrong();
}
}

/* GAME 4 */

const game4Data=[
{img:'fog',correct:'f',options:['d','l','f']},
{img:'dog',correct:'d',options:['m','j','d']},
{img:'log',correct:'l',options:['l','f','j']},
{img:'jog',correct:'j',options:['s','j','t']}
];

let game4Index=0;

function startGame4(){
instruction.innerHTML='Game 4: Look at the picture and choose the correct letter.';
const item=game4Data[game4Index];

content.innerHTML=`
<h2>Game 4</h2>
<div class="imageBox">
<img src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/${item.img}.png">
</div>
<h1 style="font-size:4rem;margin-top:15px;">_og</h1>
<div class="letters">
${shuffle([...item.options]).map(letter=>`<button class="letterBtn" onclick="checkGame4('${letter}')">${letter}</button>`).join('')}
</div>`;

speak(item.img);
}

function checkGame4(letter){
const item=game4Data[game4Index];

if(letter===item.correct){
showCorrect();
game4Index++;
if(game4Index<game4Data.length){
setTimeout(startGame4,1200);
}else{
finishGame();
}
}else{
showWrong();
}
}

function finishGame(){
instruction.innerHTML='Wonderful Work!';
content.innerHTML=`
<div style="margin-top:60px;">
<h1 style="font-size:4rem;color:#ff4081;">👏 GREAT JOB 👏</h1>
</div>`;

document.getElementById('restartBtn').style.display='block';
speak('Great Job');
}

function shuffle(array){
for(let i=array.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[array[i],array[j]]=[array[j],array[i]];
}
return array;
}

</script>

</body>
</html>
