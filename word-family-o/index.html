<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Family 'o'</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Patrick Hand',cursive;
background:#fff7f0;
overflow:hidden;
touch-action:none;
}

#intro{
position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
flex-direction:column;
}

#intro img{
width:220px;
max-width:80%;
}

#intro h1{
margin-top:20px;
font-size:40px;
color:#ff6699;
}

#gameContainer{
display:none;
width:100vw;
height:100vh;
overflow:hidden;
background:linear-gradient(#dff7ff,#fff6d5);
position:relative;
}

#topBar{
width:100%;
background:#ffb6d9;
padding:10px;
text-align:center;
font-size:26px;
font-weight:bold;
color:#5c2a00;
box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

#gameTitle{
background:white;
padding:8px;
margin:10px auto;
width:90%;
border-radius:15px;
font-size:28px;
text-align:center;
color:#ff4081;
font-weight:bold;
}

#instruction{
background:#fff;
padding:10px;
margin:0 auto 10px;
width:95%;
border-radius:15px;
text-align:center;
font-size:22px;
color:#333;
}

#gameArea{
position:relative;
width:100%;
height:calc(100vh - 160px);
overflow:auto;
padding-bottom:120px;
}

.center{
display:flex;
justify-content:center;
align-items:center;
}

.optionBtn{
background:#fff176;
padding:14px 20px;
border-radius:20px;
font-size:28px;
margin:10px;
border:none;
cursor:pointer;
box-shadow:0 4px 6px rgba(0,0,0,0.2);
font-family:'Patrick Hand',cursive;
}

.optionBtn:active{
transform:scale(0.95);
}

.feedback{
position:fixed;
top:40%;
left:50%;
transform:translate(-50%,-50%);
font-size:90px;
display:none;
z-index:999;
}

#restartBtn{
display:none;
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
padding:16px 28px;
font-size:28px;
border:none;
border-radius:20px;
background:#ff6699;
color:white;
font-family:'Patrick Hand',cursive;
z-index:1000;
}

img{
max-width:100%;
}

.balloon{
width:90px;
height:120px;
background:#ff6fa5;
border-radius:50%;
position:relative;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
font-weight:bold;
color:white;
cursor:pointer;
margin:10px;
animation:float 2s infinite ease-in-out;
}

.balloon:nth-child(2){
background:#6ec6ff;
}

.balloon:nth-child(3){
background:#81c784;
}

.balloon:nth-child(4){
background:#ffd54f;
}

.balloon::after{
content:'';
position:absolute;
bottom:-30px;
width:2px;
height:30px;
background:#555;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

#dragWords{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:12px;
padding:20px;
width:100%;
}

.dragCard{
background:#fff176;
padding:14px 20px;
border-radius:18px;
font-size:28px;
font-weight:bold;
touch-action:none;
user-select:none;
cursor:grab;
box-shadow:0 4px 8px rgba(0,0,0,0.2);
position:relative;
z-index:10;
min-width:100px;
text-align:center;
}

.houseCard{
background:white;
border:4px dashed #ffb74d;
border-radius:20px;
padding:10px;
width:140px;
min-height:180px;
text-align:center;
margin:10px;
}

.houseCard img{
width:100px;
height:100px;
object-fit:contain;
}

.dropZone{
margin-top:10px;
height:45px;
border:2px dashed #999;
border-radius:12px;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
font-weight:bold;
background:#f8f8f8;
}

.letterBtn{
width:80px;
height:80px;
font-size:40px;
border:none;
border-radius:20px;
margin:10px;
background:#81d4fa;
font-family:'Patrick Hand',cursive;
}

.wordBox{
font-size:50px;
font-weight:bold;
margin:20px;
}

@media(max-width:768px){

#topBar{
font-size:20px;
}

#instruction{
font-size:18px;
}

.optionBtn{
font-size:22px;
padding:12px;
}

.balloon{
width:75px;
height:100px;
font-size:24px;
}

.dragCard{
font-size:24px;
min-width:90px;
}

.houseCard{
width:120px;
min-height:160px;
}

.wordBox{
font-size:40px;
}

.letterBtn{
width:65px;
height:65px;
font-size:34px;
}

}

</style>
</head>

<body>

<div id="intro">
<img src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/innovine-logo.png">
<h1>Word Family 'o'</h1>
</div>

<div id="gameContainer">

<div id="topBar">Word Family 'o'</div>

<div id="gameTitle">Game 1</div>

<div id="instruction"></div>

<div id="gameArea"></div>

<div class="feedback" id="feedback"></div>

<button id="restartBtn">Play Again</button>

<audio id="correctSound"
src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/correct.mp3"></audio>

<audio id="wrongSound"
src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/wrong.mp3"></audio>

<audio id="bgMusic" loop
src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/background-music.mp3"></audio>

</div>

<script>

const gameArea=document.getElementById("gameArea");
const instruction=document.getElementById("instruction");
const gameTitle=document.getElementById("gameTitle");
const feedback=document.getElementById("feedback");
const restartBtn=document.getElementById("restartBtn");

const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");
const bgMusic=document.getElementById("bgMusic");

function speak(text){
speechSynthesis.cancel();
const utter=new SpeechSynthesisUtterance(text);
utter.rate=0.85;
speechSynthesis.speak(utter);
}

function showFeedback(type){
feedback.style.display='block';

if(type==="correct"){
feedback.innerHTML="👏";
correctSound.play();
}else{
feedback.innerHTML="❌";
wrongSound.play();
}

setTimeout(()=>{
feedback.style.display='none';
},1000);
}

function shuffle(arr){
return arr.sort(()=>Math.random()-0.5);
}

setTimeout(()=>{
document.getElementById("intro").style.display="none";
document.getElementById("gameContainer").style.display="block";
bgMusic.volume=0.3;
bgMusic.play();
startGame1();
},5000);

/* ---------------- GAME 1 ---------------- */

let game1Words=shuffle([
{word:"hop"},
{word:"top"},
{word:"mop"},
{word:"cop"}
]);

let g1Index=0;

function startGame1(){

gameTitle.innerHTML="Game 1";
instruction.innerHTML="Look at the picture and pop the balloon with the correct word.";

const current=game1Words[g1Index];

gameArea.innerHTML=`

<div style="text-align:center;padding:10px;">

<img src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/${current.word}.png"
style="width:220px;height:220px;object-fit:contain;">

<div style="display:flex;justify-content:center;flex-wrap:wrap;margin-top:20px;">

${shuffle(["hop","top","mop","cop"]).map(word=>`
<div class="balloon" onclick="checkGame1('${word}')">${word}</div>
`).join('')}

</div>

</div>
`;

speak(current.word);

}

function checkGame1(word){

if(word===game1Words[g1Index].word){

showFeedback("correct");

g1Index++;

if(g1Index<game1Words.length){

setTimeout(startGame1,1200);

}else{

setTimeout(startGame2,1500);

}

}else{

showFeedback("wrong");
speak("Try again");

}

}

/* ---------------- GAME 2 ---------------- */

let game2Words=shuffle([
"cob","rob","sob","mob"
]);

let g2Index=0;

function startGame2(){

gameTitle.innerHTML="Game 2";
instruction.innerHTML="Look at the picture and choose the correct word.";

const current=game2Words[g2Index];

gameArea.innerHTML=`

<div style="padding:20px;text-align:center;">

<img src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/${current}.png"
style="width:220px;height:220px;object-fit:contain;">

<div style="margin-top:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:15px;max-width:500px;margin:auto;">

${shuffle(["cob","rob","sob","mob"]).map(word=>`
<button class="optionBtn" onclick="checkGame2('${word}')">${word}</button>
`).join('')}

</div>

</div>
`;

speak(current);

}

function checkGame2(word){

if(word===game2Words[g2Index]){

showFeedback("correct");

g2Index++;

if(g2Index<game2Words.length){

setTimeout(startGame2,1200);

}else{

setTimeout(startGame3,1500);

}

}else{

showFeedback("wrong");
speak("Try again");

}

}

/* ---------------- GAME 3 ---------------- */

let game3Data=shuffle([
{word:"hot"},
{word:"pot"},
{word:"dot"},
{word:"cot"},
{word:"tot"}
]);

function startGame3(){

gameTitle.innerHTML="Game 3";
instruction.innerHTML="Look at the picture and drag the correct word to match it.";

gameArea.innerHTML=`

<div style="display:flex;flex-wrap:wrap;justify-content:center;padding:10px;" id="houses"></div>

<div id="dragWords"></div>
`;

const houses=document.getElementById("houses");
const dragWords=document.getElementById("dragWords");

game3Data.forEach(item=>{

houses.innerHTML+=`
<div class="houseCard">

<img src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/${item.word}.png">

<div class="dropZone" data-word="${item.word}"></div>

</div>
`;

});

shuffle([...game3Data]).forEach(item=>{

dragWords.innerHTML+=`
<div class="dragCard" draggable="true" data-word="${item.word}">
${item.word}
</div>
`;

});

enableDragDrop();

}

function enableDragDrop(){

const draggables=document.querySelectorAll(".dragCard");
const zones=document.querySelectorAll(".dropZone");

draggables.forEach(card=>{

card.addEventListener("dragstart",e=>{
e.dataTransfer.setData("text",card.dataset.word);
});

card.addEventListener("touchstart",touchStart,{passive:false});

});

zones.forEach(zone=>{

zone.addEventListener("dragover",e=>e.preventDefault());

zone.addEventListener("drop",e=>{

e.preventDefault();

const word=e.dataTransfer.getData("text");

handleDrop(word,zone);

});

});

}

/* TOUCH SUPPORT */

let dragged=null;

function touchStart(e){

dragged=e.target;

dragged.style.position="fixed";
dragged.style.zIndex=9999;

moveAt(e.touches[0].pageX,e.touches[0].pageY);

document.addEventListener("touchmove",touchMove,{passive:false});
document.addEventListener("touchend",touchEnd);

}

function touchMove(e){

e.preventDefault();

moveAt(e.touches[0].pageX,e.touches[0].pageY);

}

function moveAt(x,y){

dragged.style.left=(x-50)+"px";
dragged.style.top=(y-30)+"px";

}

function touchEnd(e){

const touch=e.changedTouches[0];

const elem=document.elementFromPoint(touch.clientX,touch.clientY);

if(elem && elem.classList.contains("dropZone")){

handleDrop(dragged.dataset.word,elem,dragged);

}else{

resetCard(dragged);

}

document.removeEventListener("touchmove",touchMove);
document.removeEventListener("touchend",touchEnd);

}

function resetCard(card){

card.style.position="relative";
card.style.left="0";
card.style.top="0";

}

function handleDrop(word,zone,card=null){

if(zone.dataset.word===word && zone.innerHTML===""){

zone.innerHTML=word;

showFeedback("correct");

const removeCard=card || [...document.querySelectorAll(".dragCard")]
.find(c=>c.dataset.word===word);

removeCard.style.display="none";

const done=[...document.querySelectorAll(".dropZone")]
.every(z=>z.innerHTML!=='');

if(done){

setTimeout(startGame4,1500);

}

}else{

showFeedback("wrong");

if(card){
resetCard(card);
}

}

}

/* ---------------- GAME 4 ---------------- */

let game4Data=shuffle([
{img:"fog",correct:"f",options:["d","l","f"]},
{img:"dog",correct:"d",options:["m","j","d"]},
{img:"log",correct:"l",options:["l","f","j"]},
{img:"jog",correct:"j",options:["s","j","t"]}
]);

let g4Index=0;

function startGame4(){

gameTitle.innerHTML="Game 4";
instruction.innerHTML="Look at the picture and choose the correct letter.";

const current=game4Data[g4Index];

gameArea.innerHTML=`

<div style="text-align:center;padding:20px;">

<img src="https://raw.githubusercontent.com/deepikadeorukhkar/LY3-Literacy1/main/word-family-o/assets/${current.img}.png"
style="width:220px;height:220px;object-fit:contain;">

<div class="wordBox">_og</div>

<div>

${shuffle(current.options).map(letter=>`
<button class="letterBtn"
onclick="checkGame4('${letter}')">${letter}</button>
`).join('')}

</div>

</div>
`;

speak(current.img);

}

function checkGame4(letter){

if(letter===game4Data[g4Index].correct){

showFeedback("correct");

g4Index++;

if(g4Index<game4Data.length){

setTimeout(startGame4,1200);

}else{

finishGame();

}

}else{

showFeedback("wrong");
speak("Try again");

}

}

function finishGame(){

gameArea.innerHTML=`
<div class="center" style="flex-direction:column;height:100%;">

<div style="font-size:120px;">👏</div>

<h1 style="font-size:60px;color:#ff4081;">Great Job!</h1>

</div>
`;

speak("Great job! You completed all games.");

restartBtn.style.display="block";

}

restartBtn.onclick=()=>{

location.reload();

};

</script>

</body>
</html>
